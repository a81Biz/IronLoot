services:
  # ===========================================
  # Nginx Reverse Proxy (subdomains)
  # localhost        → base:5174  (web/ legacy retirado)
  # api.localhost    → api:3000
  # admin.localhost  → admin:3001
  # base.localhost   → base:5174  (PT-015 activated)
  # client.localhost → client:5175 (PT-015 activated)
  # ===========================================
  nginx:
    build:
      context: ./src/nginx
      dockerfile: Dockerfile
    container_name: ironloot-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started
      base:
        condition: service_started
      client:
        condition: service_started
    networks:
      - ironloot-network
    restart: unless-stopped

  # PT-167 — El nginx con TLS, que PT-158 documento y no existia.
  #
  # `src/nginx/tls/README.md` decia `docker compose --profile tls up -d nginx`, y **ese perfil no
  # estaba declarado en ninguna parte**. Docker Compose no protesta ante un perfil desconocido: monta
  # el `nginx` de siempre, sin TLS, y todo parece funcionar. Es peor que un error — es el comando que
  # promete una cosa y hace otra, en silencio.
  #
  # Lo encontro el grafo de conocimiento al cruzar el guion con `docker-compose.yml`, no una prueba.
  # Y lo escribi yo mismo unas horas antes: documente un comando sin ejecutarlo.
  #
  # Servicio aparte y no un perfil sobre el `nginx` normal, porque los dos no pueden convivir en el
  # puerto 80.
  nginx-tls:
    build:
      context: ./src/nginx
      dockerfile: Dockerfile
    container_name: ironloot-nginx-tls
    profiles:
      - tls
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./src/nginx/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/nginx/tls:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started
      base:
        condition: service_started
      client:
        condition: service_started
    networks:
      - ironloot-network
    restart: unless-stopped

  # ===========================================
  # Iron Loot Admin Panel (NestJS SSR)
  # ===========================================
  admin:
    build:
      context: ./src/admin
      dockerfile: Dockerfile.dev
    container_name: ironloot-admin
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    environment:
      # PT-111 (F-39): sin esto ADMIN apuntaba a localhost:6379, que dentro del contenedor no es
      # Redis, y las sesiones caian a memoria sin que nadie lo notara.
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - ADMIN_PORT=3001
      - ADMIN_API_URL=http://api:3000
      # PT-218 — A donde lleva «Ver sitio». Derivada de PUBLIC_*, como BASE_URL en base/client:
      # el layout llevaba `http://localhost:5174` escrito a mano en las 28 pantallas.
      - PUBLIC_SITE_URL=${PUBLIC_SCHEME:-http}://base.${PUBLIC_DOMAIN:-ironloot.local}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-dev-admin-key}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-admin-dev-secret-change-me}
    volumes:
      - ./src/admin/src:/app/src
      - ./src/admin/views:/app/views
      - ./src/admin/public:/app/public
      - ./src/admin/package.json:/app/package.json
      - ./src/admin/tsconfig.json:/app/tsconfig.json
      - ./src/admin/nest-cli.json:/app/nest-cli.json
      - ./src/admin/nest-cli.dev.json:/app/nest-cli.dev.json
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ironloot-network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ===========================================
  # Iron Loot API (NestJS)
  # ===========================================
  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile.dev
    container_name: ironloot-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      # PT-166 — Techo de heap para que `npx jest` SIN FLAGS pase la suite entera.
      #
      # PT-159 fijo `maxWorkers: 1` y con eso bastaba: 102 suites cabian. Hoy son 107 y con un solo
      # proceso el heap acumula a lo largo de todas, asi que el default de Node en un contenedor de
      # 1 GB (~512 MB) se queda corto y el proceso muere con `JavaScript heap out of memory`.
      #
      # No es un defecto del codigo. Pero deja el mismo sintoma que PT-159 vino a quitar —un
      # «Aborted (core dumped)» sin que nada este roto— y quien lo vea aprende a desconfiar de la
      # suite. Se sube el limite del contenedor a 2 GB y se le da a Node 1.5 GB de heap.
      #
      # `workerIdleMemoryLimit` se probo y NO sirve: emite un aviso de validacion y tumba seis
      # suites. La palanca era el techo, no el reciclado.
      - NODE_OPTIONS=--max-old-space-size=1536
      # PT-174/PT-175 — Horas que el neto de una venta espera en `pending_balance` tras la confirmacion
      # del comprador.
      #
      # **La reserva es 72, no 0** (PT-182). Estuvo en `:-0` unas horas y era la misma familia que H-029 y
      # H-030: un control que aparenta estar puesto y no lo esta. Un despliegue que no declarase la
      # variable liberaba el neto **al instante** de la confirmacion, sin ventana de proteccion para el
      # comprador, y nada lo habria dicho — el cron corre, los asientos cuadran, la espera simplemente no
      # existe. Es RULE-17 aplicada a una regla de negocio: el valor por defecto no puede ser el
      # desprotegido.
      #
      # QA pone 0 **explicitamente** en el `.env` para que la fase 35 recorra la cadena sin esperar tres
      # dias. Eso es CONFIGURAR: se ejecuta el mismo codigo y solo se adelanta el reloj. Sembrar el
      # resultado con un `INSERT` —lo que hace `60-withdrawal.js`— es afirmar que ocurrio algo que nunca
      # paso por ahi.
      - SETTLEMENT_HOLDBACK_HOURS=${SETTLEMENT_HOLDBACK_HOURS:-72}
      - DATABASE_URL=postgresql://${DB_USER:-ironloot}:${DB_PASSWORD:-ironloot_dev}@db:5432/${DB_NAME:-ironloot_db}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-debug}

      - TRACE_ENABLED=true
      - ADMIN_API_KEY=${ADMIN_API_KEY:-dev-admin-key}
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - MAIL_USER=test
      - MAIL_PASSWORD=test
      - MAIL_FROM="Iron Loot <noreply@ironloot.com>"
      # PT-088 — Derivado de PUBLIC_SCHEME/PUBLIC_DOMAIN. No se escribe a mano.
      - BASE_URL=${PUBLIC_SCHEME:-http}://base.${PUBLIC_DOMAIN:-ironloot.local}
      - CLIENT_URL=${PUBLIC_SCHEME:-http}://client.${PUBLIC_DOMAIN:-ironloot.local}
      - JWT_SECRET=${JWT_SECRET:-change-me-min-32-chars}
      # PT-196 — Ventana de gracia de la rotacion del refresh token. **Sin reserva** (RULE-17): con 0
      # se expulsa a usuarios legitimos por concurrencia, y con una cifra generosa se abre una ventana
      # que nadie decidio. Las dos se ven como «funciona» y una es un agujero.
      - ROTATION_GRACE_SEC=${ROTATION_GRACE_SEC:?ROTATION_GRACE_SEC es obligatoria}
    # Load additional env vars from project .env into the container
    env_file:
      - ./src/api/.env
    volumes:
      - ./src/api/src:/app/src
      - ./src/api/prisma:/app/prisma
      - ./src/api/test:/app/test
      - ./src/api/package.json:/app/package.json
      - ./src/api/tsconfig.json:/app/tsconfig.json
      - ./src/api/nest-cli.json:/app/nest-cli.json
      # PT-172 — La configuracion de Jest vive aqui desde que salio de `package.json` (JSON no admite
      # comentarios, y la explicacion de `maxWorkers` se colaba como clave que Jest rechazaba en cada
      # corrida). **Sin este montaje, el contenedor no la ve**: Jest cae a Babel, no aplica `ts-jest`, y
      # las 111 suites fallan con `SyntaxError` sobre TypeScript perfectamente valido. Es PT-138 otra
      # vez —lo que no esta montado, el contenedor lo ejecuta de otra forma— y se descubrio aqui porque
      # el arreglo se probo, no se supuso.
      - ./src/api/jest.config.js:/app/jest.config.js
      # PT-138 — Los scripts de auditoria NO estaban montados, asi que el contenedor ejecutaba una
      # copia congelada en la imagen: editar `observability-check.ts` y volver a lanzarlo daba el
      # resultado ANTERIOR, sin avisar. Es la peor forma de un fallo de entorno — no falla, miente.
      - ./src/api/scripts:/app/scripts
      - ./src/api/security-baseline.json:/app/security-baseline.json
      - ./src/api/observability-baseline.json:/app/observability-baseline.json
      # PT-138 — Y la raiz del monorepo, en solo lectura: ocho guardas resuelven `RAIZ` subiendo
      # cinco niveles y dentro del contenedor eso era `/`, asi que fallaban con ENOENT y **0 pruebas
      # ejecutadas**. Pasaban en el host y en CI; no aqui, que es donde RULE-15 dice que vive npm.
      - .:/repo:ro
      # @ironloot/core workspace package — mounted so the entrypoint can symlink it
      - ./src/packages/core:/packages/core
      # Exclude node_modules to use container's version
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ironloot-network
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  db:
    image: postgres:16-alpine
    container_name: ironloot-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-ironloot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ironloot_dev}
      POSTGRES_DB: ${DB_NAME:-ironloot_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/api/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - ironloot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ironloot} -d ${DB_NAME:-ironloot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ===========================================
  # Redis (Cache & Sessions)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: ironloot-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ironloot-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # ===========================================
  # Mailhog (Local Email Testing)
  # ===========================================
  mailhog:
    image: mailhog/mailhog
    container_name: ironloot-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025" # SMTP server
      - "${MAILHOG_UI_PORT:-8025}:8025" # Web UI
    networks:
      - ironloot-network
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # ===========================================
  # pgAdmin (Database Administration) - Optional
  # ===========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ironloot-pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ironloot.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ironloot-network
    depends_on:
      - db
    profiles:
      - tools
    restart: unless-stopped

  # ===========================================
  # IronLoot BASE — Public Site (PT-015 activated)
  # Accessible at: http://base.localhost
  # ===========================================
  base:
    build:
      context: ./src/apps/base
      dockerfile: Dockerfile.dev
    container_name: ironloot-base
    ports:
      - "${BASE_PORT:-5174}:5174"
    environment:
      - NODE_ENV=development
      - BASE_PORT=5174
      - API_URL=http://api:3000
      - CLIENT_URL=${PUBLIC_SCHEME:-http}://client.${PUBLIC_DOMAIN:-ironloot.local}
      # PT-223 — Origen publico para URL canonicas, Open Graph y sitemap. Derivada de PUBLIC_*, como
      # el resto: escribir un `localhost` aqui es justo lo que PT-088 prohibe, y una canonica
      # equivocada es PEOR que ninguna — le dice al buscador que indexe otra direccion.
      - PUBLIC_SITE_URL=${PUBLIC_SCHEME:-http}://base.${PUBLIC_DOMAIN:-ironloot.local}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-.ironloot.local}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-Lax}
    volumes:
      - ./src/apps/base/src:/app/src
      - ./src/apps/base/views:/app/views
      - ./src/apps/base/public:/app/public
      - ./src/apps/base/package.json:/app/package.json
      - ./src/apps/base/tsconfig.json:/app/tsconfig.json
      - ./src/apps/base/nest-cli.json:/app/nest-cli.json
      # PT-108 (F-36) — sin este montaje, `docker restart ironloot-base` deja BASE en 503.
      - ./src/apps/base/nest-cli.dev.json:/app/nest-cli.dev.json
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5174/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ironloot-network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ===========================================
  # IronLoot CLIENT — Private Portal (PT-015 activated)
  # Accessible at: http://client.localhost
  # ===========================================
  client:
    build:
      context: ./src/apps/client
      dockerfile: Dockerfile.dev
    container_name: ironloot-client
    ports:
      - "${CLIENT_PORT:-5175}:5175"
    environment:
      - NODE_ENV=development
      - CLIENT_PORT=5175
      - API_URL=http://api:3000
      - BASE_URL=${PUBLIC_SCHEME:-http}://base.${PUBLIC_DOMAIN:-ironloot.local}
      - JWT_SECRET=${JWT_SECRET:-change-me-min-32-chars}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-.ironloot.local}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-Lax}
    volumes:
      - ./src/apps/client/src:/app/src
      - ./src/apps/client/views:/app/views
      - ./src/apps/client/public:/app/public
      - ./src/apps/client/package.json:/app/package.json
      - ./src/apps/client/tsconfig.json:/app/tsconfig.json
      - ./src/apps/client/nest-cli.json:/app/nest-cli.json
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5175/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ironloot-network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

networks:
  ironloot-network:
    driver: bridge

volumes:
  postgres_data:
    name: ironloot_postgres_data
  redis_data:
    name: ironloot_redis_data
  pgadmin_data:
    name: ironloot_pgadmin_data
