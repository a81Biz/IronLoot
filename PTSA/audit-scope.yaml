# PTSA V3 — Alcance de auditoría y delta sync
# Sistema: IronLoot — Plataforma de Subastas (v1.0.0)
# Generado: 2026-06-23 (S-001)

system: IronLoot
ptsa_version: "3.0"
domain: "Plataforma de subastas en tiempo real — mercado mexicano (MXN)"

auditable_patterns:
  # API principal
  - "src/api/src/**/*.ts"
  - "src/api/src/**/*.service.ts"
  - "src/api/src/**/*.controller.ts"
  - "src/api/src/**/*.module.ts"
  - "src/api/src/main.ts"
  # Base de datos
  - "src/api/prisma/schema.prisma"
  - "src/api/prisma/migrations/**/*.sql"
  # Librería core
  - "src/packages/core/src/**/*.ts"
  # Aplicaciones SSR
  - "src/apps/base/src/**/*.ts"
  - "src/apps/client/src/**/*.ts"
  - "src/apps/base/views/**/*.html"
  - "src/apps/client/views/**/*.html"
  # Admin backoffice
  - "src/admin/src/**/*.ts"
  - "src/admin/views/**/*.html"
  # Infraestructura
  - "docker-compose.yml"
  - ".env.example"
  - "src/nginx/nginx.conf"
  # S-002 — Dos huecos que costaron H-014 y H-015.
  # El pipeline no estaba en el alcance: por eso un job de CI que no puede terminar en verde
  # sobrevivio nueve sesiones. Y el script que aplica el esquema de la BD en cada arranque
  # tampoco: es la causa directa de que las 23 migraciones no se hayan ejecutado nunca.
  - ".github/workflows/**"
  - "src/api/scripts/**"
  # Y las imagenes: el healthcheck de la de produccion apunta a un 404 desde que existe (H-017).
  - "**/Dockerfile"
  - "**/Dockerfile.dev"
  # Documentación crítica
  #
  # PT-157 — Aquí había una SEGUNDA lista con las mismas tres rutas archivadas. Corregir sólo la de
  # `docs:` habría dejado el fichero mintiendo igual, en otro sitio y con la guarda en verde: la
  # primera versión de esta corrección hizo exactamente eso, y fue la guarda quien lo dijo.
  #
  # Es la lección de PT-140 en pequeño — un dato en dos sitios sin declarar cuál manda se desvía —
  # y la razón de que este PT lleve mecanismo y no sólo una corrección.
  - "CLAUDE.md"
  - "docs-v2/1-negocio/PRD-Product-Requirements.md"
  - "docs-v2/3-arquitectura/Software-Architecture-Document.md"
  - "docs-v2/4-ingenieria/Software-Design-Document.md"
  - "docs/enterprise-documentation/11-Conventions.md"
  - "docs/enterprise-documentation/10-Technical-Debt.md"

ignore_patterns:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "graphify-out/**"
  - "docs/methodology/**"
  - "docs/implementation/**"
  - "PTSA/**"
  - "changes/**"
  - "**/*.js.map"
  - "**/*.d.ts"

# Cifras recontadas en S-002 (2026-07-27). Las anteriores eran del 23-jun y estaban viejas:
# declaraban 27 modelos, 12 migraciones y ~84 endpoints. Los objetivos siguen siendo `all`;
# lo que cambia es contra que se mide ese `all`.
coverage_targets:
  products: all        # 12 productos identificados
  endpoints: all       # 159 rutas REST (80 GET · 42 POST · 26 PATCH · 9 PUT · 2 DELETE)
  services: all        # 39 ficheros *.service.ts en el API
  tables: all          # 33 modelos Prisma = 33 tablas en la BD real
  prompts: "N/A"       # Sistema determinístico, sin prompts LLM
  # PT-157 — Esto decia «23 migraciones — OJO: ninguna se ha ejecutado nunca (H-014)». Las dos
  # mitades eran falsas: son 2 —PT-127 las refundio en un `initial_schema`— y **las dos estan
  # aplicadas**, verificado en `_prisma_migrations` el 2026-07-29 (E-027). El comentario congelo el
  # estado de H-014 en el momento de detectarlo y nadie lo reviso al cerrarlo.
  migrations: all      # 2 migraciones, las dos aplicadas y sin rollback (H-014 CERRADA)
  # PT-157 (H-024) — Las cuatro rutas de abajo apuntaban a
  # `docs/enterprise-documentation/{02-PRD,03-TRD,09-Security-Architecture,06-Backend-Architecture}.md`
  # y **ninguna existia ya**: PT-141 las archivo el 2026-07-29 bajo ADR-049, y ese PT siguio las
  # citas de CLAUDE.md y la del TRD pero no esta.
  #
  # Es la familia de H-016 aplicada al fichero que declara QUE se audita: una auditoria que dice
  # cubrir cuatro documentos inexistentes declara una cobertura que no tiene, y `[A8]` hace de la
  # cobertura declarada un requisito del score.
  #
  # Se reapuntan a `docs-v2/`, que es donde ADR-049 dejo la documentacion de producto. Y lo vigila
  # `alcance-de-auditoria-existe.spec.ts` (RULE-28), porque es la TERCERA vez que el patron aparece
  # —H-016, PT-130, esto— y reapuntar rutas sin mecanismo es lo que produjo la tercera.
  docs:
    - CLAUDE.md
    - docs-v2/1-negocio/PRD-Product-Requirements.md
    - docs-v2/3-arquitectura/Software-Architecture-Document.md
    - docs-v2/4-ingenieria/Software-Design-Document.md
    - docs/enterprise-documentation/11-Conventions.md
    - docs/enterprise-documentation/10-Technical-Debt.md

audit_due_policy:
  CRITICA: 30d
  ALTA: 60d
  MEDIA: 90d
  BAJA: 180d

ci_checkpoints:
  # PT-118 — D2 deja de ser una declaracion: se dice DONDE corre cada parte.
  # Estuvo declarado sin existir desde el 23-jun, y por eso H-008 llego con 34 dias de retraso.
  - D2    # tests (.github/workflows/ci.yml: test-unit, test-integration)
          # schema (npm run typecheck + prisma)
          # vulnerabilidades -> ci.yml: security-audit  ->  npm run audit:check
          #   compara contra src/api/security-baseline.json (13 paquetes triados, TD-015)
  # PT-121 — D3 deja de ser una declaracion.
  - D3    # trazabilidad + logging -> src/api/scripts/observability-check.ts
          #   `npm run audit:observability`
          #   silent_failure_count: catch que no registran ni relanzan, contra linea base.
          #     Incluye el JavaScript de NAVEGADOR: es donde vivia F-34.
          #   trace_completeness: % de ciclos liquidados con la cadena de traza completa.
          #   prompt_provenance: NO_APLICA. fallback_quality: evaluacion documentada ([R57]).
  # PT-122 — D5 SALE de ci_checkpoints: es una clasificacion equivocada, no algo pendiente.
  # Success/Retry Rate se calculan sobre HISTORIA DE EJECUCION, y en CI la base nace vacia en cada
  # corrida: el checkpoint devolveria SIN_DATOS siempre y alguien acabaria leyendolo como verde.
  # D5 es metrica de DELTA SYNC -> src/api/scripts/reliability-check.ts
  #   `npm run audit:reliability`, contra un entorno CON historia.
  # PT-128 — D3 deja de ser una declaracion: ya CORRE en ci.yml (job `observabilidad`).
  #   Su parte medible (silent_failure_count, analisis estatico de catch mudos) no necesita datos.
  # PT-127 — El checkpoint de esquema deja de ser vago («typecheck + prisma»): es `audit:schema`,
  #   job `schema-drift` en ci.yml, SIN needs. Falla si migraciones y schema.prisma divergen.
  #
  # PT-128 — D1.N1 SALE de ci_checkpoints, por el mismo motivo que PT-122 saco D5: su entrada es la
  # SALIDA REAL, y en CI la base nace vacia en cada corrida. El checkpoint devolveria SIN_DATOS
  # siempre y alguien acabaria leyendolo como verde. Es metrica de DELTA SYNC, contra un entorno
  # con datos -> `npm run audit:domain`.
  # (declaracion historica, conservada para trazabilidad)
  # - "D1.N1"  # Domain Rules as Code -> src/api/scripts/domain-rules.ts
             #   `npm run audit:domain` — 14 reglas de F-1 §4 y §5, con pesos.
             #   Incluye Nivel 3 (coherencia inter-producto) en bloque aparte.
             #   CR-007 y CR-008 NO entran: su entrada es la peticion, no el producto ([R57]).

# Nota: Nivel 4 (Guardrails IA) = NO_APLICA — sistema determinístico sin LLM
# D5 Hallucination Rate = NO_APLICA, Output Drift = NO_APLICA
