name: CI

# PT-136 — El disparador se declara contra la realidad, no contra una aspiracion.
#
# Esto decia `[dev, qa, prep, prod]`. Ninguna de las cuatro ha existido nunca: la unica rama de
# este repositorio es `master`. El YAML era valido, GitHub listaba el workflow como `active`, y
# los ocho jobs **no se ejecutaron ni una sola vez** en toda la historia del proyecto.
#
# Conservarlas "por si algun dia" reproduce la causa exacta. Si se quiere un flujo por entornos,
# entra con su ADR y con las ramas creadas.
#
# `workflow_dispatch` no es un extra: permite lanzar la corrida a mano y mirarla. Un workflow que
# solo corre cuando alguien empuja es un workflow que no se puede interrogar.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================
  # Lint & Type Check
  # ===========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # PT-136 — `@ironloot/core` se resuelve por `dist/`, y `dist/` esta en .gitignore:73.
      # Sin este paso, `tsc` no encuentra el modulo y ocho ficheros del API no compilan. Nadie lo
      # habia visto porque en el host el `dist/` sobrevive de una compilacion anterior, y CI no
      # habia corrido nunca.
      - name: Build @ironloot/core
        run: npm run build:core

      - name: Run linter
        run: npm run lint:check

      - name: Run type check
        run: npm run typecheck

  # ===========================================
  # Dependencias vulnerables (checkpoint D2)
  # ===========================================
  # PT-118 (PTSA H-008) — `audit-scope.yaml` declara este checkpoint desde el 23-jun y no
  # existia. La consecuencia se midio: H-008 llego con 34 dias de retraso, con 71 avisos en
  # produccion y uno alcanzable SIN AUTENTICAR contra la puja en vivo. Un checkpoint previsto
  # y no ejecutado es peor que no tenerlo: da por cubierta un area que nadie mira.
  #
  # Compara contra `src/api/security-baseline.json`, no contra un umbral: `--audit-level=high`
  # fallaria desde el primer dia por las 13 ya triadas, el CI quedaria rojo permanente, y
  # alguien lo desactivaria.
  security-audit:
    name: Dependencias vulnerables (D2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Comprobar avisos nuevos contra la linea base
        run: npm --prefix ./src/api run audit:check

  # ===========================================
  # PT-127 (PTSA H-014) — Deriva del esquema
  # ===========================================
  # Las 23 migraciones no se habian ejecutado NUNCA: el esquema lo aplicaba `db push`, que no
  # escribe `_prisma_migrations`. Producian otro esquema — el cliente Prisma fallaba en 3 de 4
  # sondas y `payments.reference` perdia la unicidad que impide acreditar un deposito dos veces.
  #
  # PT-037 ya lo arreglo una vez, el 23-jul, y el drift volvio en CUATRO DIAS porque la prevencion
  # se quedo en una nota documental. Este job es la diferencia.
  #
  # SIN `needs`, a proposito, igual que security-audit: un job roto no debe poder ocultarlo. Es
  # exactamente lo que le paso a `build` y `docker` con H-015.
  #
  # Veredicto binario, sin linea base: el estado esperado es CERO diferencias. Admitir una
  # diferencia «conocida» seria admitir justo lo que este control cierra.
  schema-drift:
    name: Deriva del esquema (D2)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ironloot
          POSTGRES_PASSWORD: ironloot_test
          POSTGRES_DB: ironloot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # PT-136 — Este comentario decia: «La base sombra la crea y la destruye Prisma; solo necesita
      # poder conectarse.» **Es falso.** `prisma migrate diff --from-migrations` exige que la base
      # sombra YA EXISTA: si no, sale con P1003 y el checkpoint falla sin llegar a comparar nada.
      #
      # Es la clase de afirmacion que solo se puede desmentir ejecutando, y este job no se habia
      # ejecutado nunca. El checkpoint D2 de esquema —declarado en CI desde PT-127— no habia
      # llegado a comparar un esquema ni una vez.
      - name: Crear la base sombra
        run: |
          PGPASSWORD=ironloot_test psql -h localhost -U ironloot -d ironloot_test \
            -c 'CREATE DATABASE ironloot_test_shadow_check;'

      - name: Comprobar que las migraciones reproducen schema.prisma
        run: npm --prefix ./src/api run audit:schema
        env:
          DATABASE_URL: postgresql://ironloot:ironloot_test@localhost:5432/ironloot_test

  # ===========================================
  # Unit Tests
  # ===========================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build @ironloot/core
        run: npm run build:core

      - name: Run unit tests
        run: npm run test -- --coverage --passWithNoTests

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # ===========================================
  # Integration Tests (with Docker)
  # ===========================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ironloot
          POSTGRES_PASSWORD: ironloot_test
          POSTGRES_DB: ironloot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build @ironloot/core
        run: npm run build:core

      # PT-128 (PTSA H-015) — Los dos pasos que faltaban.
      #
      # El job levantaba Postgres y corria la suite e2e contra el SIN crear el esquema: ni
      # `migrate deploy`, ni `db push`, ni `prisma generate`. Con 17 ficheros e2e presentes,
      # `--passWithNoTests` no salvaba nada. `build` y `docker` cuelgan de este job y por eso NUNCA
      # se ejecutaron.
      #
      # `npm install` en la raiz instala src/api y src/admin, pero NINGUNO genera el cliente Prisma:
      # `src/api/package.json` no tiene `postinstall`. De ahi el paso explicito.
      - name: Generar el cliente Prisma
        run: npm --prefix ./src/api run db:generate

      # Con `migrate deploy` —y NO `db push`— este job es ademas la prueba continua de que las
      # migraciones de PT-127 siguen reproduciendo el esquema. En cada push, gratis.
      # Un `db push` aqui seria la trampa que causo H-014: verde sobre un esquema no verificado.
      - name: Aplicar el esquema con migraciones
        run: npm --prefix ./src/api run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://ironloot:ironloot_test@localhost:5432/ironloot_test

      # PT-136 — La suite e2e pasaba en el host y NO podia pasar aqui, por la misma razon que
      # F-135-A: lo que la hacia funcionar era `src/api/.env`, **un fichero que no esta en git**.
      # Sin el, `MercadoPagoProvider` lanza en su constructor —`payments.module.ts:46` lo construye
      # con avidez— y con el modulo de pagos caido no arranca NINGUN test: 17 ficheros e2e fallando
      # con `Cannot read properties of undefined (reading 'close')`, un sintoma que no menciona ni
      # pagos ni configuracion.
      #
      # Un entorno de pruebas declara su configuracion; no la hereda de la maquina de alguien.
      # Valores de prueba evidentes a proposito: si un test llegara a usarlos de verdad contra una
      # pasarela, tiene que fallar de forma ruidosa, no cobrar.
      - name: Run E2E tests
        run: npm run test:e2e -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://ironloot:ironloot_test@localhost:5432/ironloot_test
          REDIS_URL: redis://localhost:6379
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-solo-para-ci-no-usar-jamas-en-produccion
          SESSION_SECRET: test-session-secret-solo-para-ci-no-usar-jamas-en-produccion
          MERCADO_PAGO_ACCESS_TOKEN: TEST-ci-no-es-un-token-real
          MERCADO_PAGO_WEBHOOK_SECRET: TEST-ci-no-es-un-secreto-real
          PAYPAL_CLIENT_ID: TEST-ci-no-es-un-client-id-real
          PAYPAL_CLIENT_SECRET: TEST-ci-no-es-un-secreto-real
          PAYPAL_WEBHOOK_ID: TEST-ci-no-es-un-webhook-id-real

  # ===========================================
  # PT-128 — Checkpoint D3: observabilidad
  # ===========================================
  # `audit-scope.yaml` lo declara desde PT-121 y no tenia job: se ejecutaba porque el auditor lo
  # ejecutaba. Es el mismo patron que PT-118 arreglo para las dependencias, un escalon mas abajo.
  #
  # Su parte medible —`silent_failure_count`, los `catch` mudos por analisis estatico— no necesita
  # datos, asi que aqui SI da una senal real.
  #
  # SIN `needs`, como security-audit y schema-drift: un job roto no debe poder ocultarlo.
  #
  # D1.N1 (`audit:domain`) NO entra: su entrada es la salida real y en CI la base nace vacia. El
  # checkpoint devolveria SIN_DATOS siempre y alguien acabaria leyendolo como verde — es lo que
  # PT-122 razono al sacar D5 de ci_checkpoints. Queda como metrica de delta sync.
  observabilidad:
    name: Observabilidad (D3)
    runs-on: ubuntu-latest

    # PT-138 — Este job NO tenia base de datos, y aun asi salia en verde.
    #
    # `trace_completeness` consultaba con `docker exec ironloot-db psql`; en el runner no hay tal
    # contenedor, la consulta fallaba, el script devolvia `SIN_DATOS` y **salia con codigo 0**. O sea
    # que el checkpoint D3 aprobaba sin haber medido una de sus dos metricas, en todas las corridas
    # desde que existe.
    #
    # Ahora `SIN_DATOS` se separa en «no hay nada que evaluar» (legitimo) y «no pude medir» (fallo),
    # asi que el job pide lo que necesita para medir de verdad.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ironloot
          POSTGRES_PASSWORD: ironloot_test
          POSTGRES_DB: ironloot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generar el cliente Prisma
        run: npm --prefix ./src/api run db:generate

      # El esquema tiene que existir: sin las tablas, la consulta falla y eso ahora ES un fallo.
      - name: Aplicar el esquema con migraciones
        run: npm --prefix ./src/api run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://ironloot:ironloot_test@localhost:5432/ironloot_test

      - name: Comprobar silencios nuevos contra la linea base
        run: npm --prefix ./src/api run audit:observability
        env:
          DATABASE_URL: postgresql://ironloot:ironloot_test@localhost:5432/ironloot_test

  # ===========================================
  # Build
  # ===========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ===========================================
  # Docker Build (on main branches only)
  # ===========================================
  # PT-143 — Este job tenia DOS motivos para no servir, y ninguno daba error.
  #
  # 1. Estaba condicionado a `refs/heads/prod` y `refs/heads/prep`: **las mismas dos ramas fantasma**
  #    que PT-136 retiro del disparador, en otro sitio del mismo fichero. Quedaba `skipped` en toda
  #    corrida, y un job saltado no cuenta como fallo: el workflow entero se declaraba `success`.
  #
  # 2. Apunta a `./Dockerfile`, **que no existe**. Las imagenes de produccion las creo PT-129 y viven
  #    en `src/api/`, `src/admin/`, `src/apps/base/` y `src/apps/client/`. Es decir: aunque la
  #    condicion hubiera sido correcta, el job habria fallado en el primer paso.
  #
  # Aqui se corrige (1), que es la clase que la guarda vigila. **(2) NO se corrige aqui**: hacer que
  # este job construya las cuatro imagenes y las arranque es trabajo con su propia verificacion, y
  # va en **PT-147**. Hasta entonces el job correra y fallara — rojo y visible, que es lo que este
  # repositorio ha decidido preferir sobre saltado y oculto.
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    # PT-147 — El API no arranca sin base de datos ni Redis. Los tres SSR si: sirven paginas, y su
    # HEALTHCHECK pide `/`, lo que ademas demuestra que `views/` y `public/` viajaron a la imagen.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ironloot
          POSTGRES_PASSWORD: ironloot_test
          POSTGRES_DB: ironloot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # LOS CONTEXTOS NO SON UNIFORMES, y no es un descuido.
      #
      # El API construye desde LA RAIZ del monorepo: su `package.json` declara
      # `"@ironloot/core": "file:../packages/core"`, y con el contexto en `src/api` no hay forma de
      # copiarlo. El propio `src/api/Dockerfile` lo avisa en su cabecera.
      #
      # Los tres SSR construyen desde su carpeta: copian solo lo suyo.
      #
      # Igualarlos —el arreglo natural que alguien intentara— rompe el del API.
      - name: Construir la imagen del API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/api/Dockerfile
          push: false
          load: true
          tags: ironloot-api:ci
          # Sin cache a proposito: es la unica que se construye en frio. En PT-135 un volumen de
          # `node_modules` reutilizado tapo un lock roto durante un dia, y la cache de buildx puede
          # hacer lo mismo con una instalacion.
          no-cache: true

      - name: Construir la imagen de ADMIN
        uses: docker/build-push-action@v5
        with:
          context: src/admin
          file: src/admin/Dockerfile
          push: false
          load: true
          tags: ironloot-admin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir la imagen de BASE
        uses: docker/build-push-action@v5
        with:
          context: src/apps/base
          file: src/apps/base/Dockerfile
          push: false
          load: true
          tags: ironloot-base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir la imagen de CLIENT
        uses: docker/build-push-action@v5
        with:
          context: src/apps/client
          file: src/apps/client/Dockerfile
          push: false
          load: true
          tags: ironloot-client:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # H-017 — CONSTRUIR NO ES ARRANCAR. Aquel healthcheck pedia `/health` cuando la ruta real era
      # `/api/v1/health`: la imagen se construia perfecta y el contenedor quedaba `unhealthy` para
      # siempre. Una imagen que solo se ha construido no esta probada.
      - name: Arrancar las cuatro y esperar su healthcheck
        run: |
          set -euo pipefail

          arrancar() {
            local nombre="$1" imagen="$2"; shift 2
            echo "::group::$nombre"
            docker run -d --name "$nombre" --network host "$@" "$imagen"
          }

          esperar_healthy() {
            local nombre="$1"
            for _ in $(seq 1 30); do
              estado=$(docker inspect -f '{{.State.Health.Status}}' "$nombre" 2>/dev/null || echo sin-healthcheck)
              [ "$estado" = healthy ] && { echo "$nombre -> healthy"; echo '::endgroup::'; return 0; }
              [ "$estado" = sin-healthcheck ] && { echo "$nombre NO declara HEALTHCHECK"; echo '::endgroup::'; return 1; }
              sleep 5
            done
            # Volcar el log ANTES de fallar: un job que muere sin decir por que obliga a
            # reproducirlo a mano, que es exactamente lo que este pipeline existe para evitar.
            echo "$nombre no llego a healthy. Log:"
            docker logs "$nombre" 2>&1 | tail -60
            echo '::endgroup::'
            return 1
          }

          # ADMIN necesita Redis para su almacen de sesiones, y su RESERVA es `redis://redis:6379`
          # — el nombre del contenedor de `docker-compose`, no una direccion que sirva fuera de esa
          # red. Sin `REDIS_URL` se queda reintentando y nunca termina de arrancar: la primera
          # corrida de este job murio exactamente asi.
          #
          # Es la familia de F-135-A: una reserva escrita para un entorno concreto que parece un
          # valor por defecto razonable y no lo es. PT-137 se ocupa del contrato de Redis; aqui solo
          # se le da lo que necesita.
          arrancar ironloot-admin-ci ironloot-admin:ci             -e NODE_ENV=production             -e ADMIN_PORT=3001             -e REDIS_URL=redis://localhost:6379             -e ADMIN_SESSION_SECRET=ci-session-secret-solo-para-verificar-que-la-imagen-arranca

          arrancar ironloot-base-ci ironloot-base:ci             -e NODE_ENV=production             -e BASE_PORT=5174             -e API_URL=http://localhost:3000

          arrancar ironloot-client-ci ironloot-client:ci             -e NODE_ENV=production             -e CLIENT_PORT=5175             -e API_URL=http://localhost:3000

          # El esquema, ANTES de arrancar el API.
          #
          # La imagen de produccion **no aplica migraciones al arrancar**: su `CMD` es
          # `node dist/main` y nada mas. Es lo correcto —migrar es un paso de despliegue deliberado,
          # no un efecto colateral de levantar un contenedor— pero significa que arrancarla exige
          # una base preparada. La corrida anterior lo dijo sin rodeos:
          #
          #     P2021 — The table `public.system_config` does not exist in the current database
          #
          # Se migra CON LA PROPIA IMAGEN, que lleva `prisma/` dentro (`src/api/Dockerfile:163`).
          # Asi se comprueba de paso que puede migrar por si misma, que es lo que un despliegue real
          # le va a pedir. Hacerlo desde el runner con un `npm ci` aparte probaria otra cosa.
          echo '::group::migraciones'
          docker run --rm --network host -e DATABASE_URL=postgresql://ironloot:ironloot_test@localhost:5432/ironloot_test ironloot-api:ci npx prisma migrate deploy
          echo '::endgroup::'

          arrancar ironloot-api-ci ironloot-api:ci             -e NODE_ENV=production             -e PORT=3000             -e DATABASE_URL=postgresql://ironloot:ironloot_test@localhost:5432/ironloot_test             -e REDIS_URL=redis://localhost:6379             -e REDIS_HOST=localhost             -e REDIS_PORT=6379             -e JWT_SECRET=ci-jwt-secret-solo-para-verificar-que-la-imagen-arranca             -e SESSION_SECRET=ci-session-secret-solo-para-verificar-que-la-imagen-arranca             -e MERCADO_PAGO_ACCESS_TOKEN=TEST-ci-no-es-un-token-real             -e MERCADO_PAGO_WEBHOOK_SECRET=TEST-ci-no-es-un-secreto-real             -e PAYPAL_CLIENT_ID=TEST-ci-no-es-real             -e PAYPAL_CLIENT_SECRET=TEST-ci-no-es-real             -e PAYPAL_WEBHOOK_ID=TEST-ci-no-es-real             -e ALLOWED_ORIGINS=http://localhost:5174,http://localhost:5175             -e ADMIN_API_KEY=ci-admin-api-key-no-usar-fuera-de-este-job             -e ADMIN_USERNAME=ci-verificador-de-imagen             -e ADMIN_PASSWORD=ci-password-larga-y-no-por-defecto-solo-para-este-job             -e ADMIN_TOTP_SECRET=CIVERIFICADORDEIMAGEN234567

          # NOTA — Estas cinco ultimas no estaban, y el API se nego a arrancar por ellas:
          #
          #   STARTUP CONFIGURATION ERRORS:
          #     - ADMIN_API_KEY must not be a placeholder value in production
          #     - ADMIN_USERNAME must be set to a non-default value (not "admin")
          #     - ADMIN_TOTP_SECRET must be set (>=16 chars) ... must not rely on a password alone
          #     - ADMIN_PASSWORD must be set to a strong non-default value
          #     - ALLOWED_ORIGINS must be explicitly set in production
          #
          # **No era un defecto: era el control funcionando.** `validateStartupConfig` (PT-036,
          # PT-093) solo actua con NODE_ENV=production, y esta es la primera vez que alguien lo
          # ejerce DENTRO DE UNA IMAGEN. Que abortara con los cinco motivos nombrados es exactamente
          # lo que se le pidio cuando se escribio.
          #
          # Los valores son evidentes a proposito: si alguno acabara en un despliegue real, tiene
          # que cantar en el primer vistazo.

          esperar_healthy ironloot-admin-ci
          esperar_healthy ironloot-base-ci
          esperar_healthy ironloot-client-ci
          esperar_healthy ironloot-api-ci
