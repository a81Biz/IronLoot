name: CI

on:
  push:
    branches: [dev, qa, prep, prod]
  pull_request:
    branches: [dev, qa, prep, prod]

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================
  # Lint & Type Check
  # ===========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint:check

      - name: Run type check
        run: npm run typecheck

  # ===========================================
  # Dependencias vulnerables (checkpoint D2)
  # ===========================================
  # PT-118 (PTSA H-008) — `audit-scope.yaml` declara este checkpoint desde el 23-jun y no
  # existia. La consecuencia se midio: H-008 llego con 34 dias de retraso, con 71 avisos en
  # produccion y uno alcanzable SIN AUTENTICAR contra la puja en vivo. Un checkpoint previsto
  # y no ejecutado es peor que no tenerlo: da por cubierta un area que nadie mira.
  #
  # Compara contra `src/api/security-baseline.json`, no contra un umbral: `--audit-level=high`
  # fallaria desde el primer dia por las 13 ya triadas, el CI quedaria rojo permanente, y
  # alguien lo desactivaria.
  security-audit:
    name: Dependencias vulnerables (D2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Comprobar avisos nuevos contra la linea base
        run: npm --prefix ./src/api run audit:check

  # ===========================================
  # PT-127 (PTSA H-014) — Deriva del esquema
  # ===========================================
  # Las 23 migraciones no se habian ejecutado NUNCA: el esquema lo aplicaba `db push`, que no
  # escribe `_prisma_migrations`. Producian otro esquema — el cliente Prisma fallaba en 3 de 4
  # sondas y `payments.reference` perdia la unicidad que impide acreditar un deposito dos veces.
  #
  # PT-037 ya lo arreglo una vez, el 23-jul, y el drift volvio en CUATRO DIAS porque la prevencion
  # se quedo en una nota documental. Este job es la diferencia.
  #
  # SIN `needs`, a proposito, igual que security-audit: un job roto no debe poder ocultarlo. Es
  # exactamente lo que le paso a `build` y `docker` con H-015.
  #
  # Veredicto binario, sin linea base: el estado esperado es CERO diferencias. Admitir una
  # diferencia «conocida» seria admitir justo lo que este control cierra.
  schema-drift:
    name: Deriva del esquema (D2)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ironloot
          POSTGRES_PASSWORD: ironloot_test
          POSTGRES_DB: ironloot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # La base sombra la crea y la destruye Prisma; solo necesita poder conectarse.
      - name: Comprobar que las migraciones reproducen schema.prisma
        run: npm --prefix ./src/api run audit:schema
        env:
          DATABASE_URL: postgresql://ironloot:ironloot_test@localhost:5432/ironloot_test

  # ===========================================
  # Unit Tests
  # ===========================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test -- --coverage --passWithNoTests

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # ===========================================
  # Integration Tests (with Docker)
  # ===========================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ironloot
          POSTGRES_PASSWORD: ironloot_test
          POSTGRES_DB: ironloot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run E2E tests
        run: npm run test:e2e -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://ironloot:ironloot_test@localhost:5432/ironloot_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  # ===========================================
  # Build
  # ===========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ===========================================
  # Docker Build (on main branches only)
  # ===========================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/prep'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ironloot-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
