{% extends "layouts/admin.html" %}
{% block content %}
<h1 class="h3 mb-4">Conciliación de pagos</h1>
<div class="card mb-4">
  <div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-auto">
        <label class="form-label">Proveedor</label>
        <select id="rcProvider" class="form-select">
          <option value="MERCADO_PAGO">MercadoPago</option>
          <option value="PAYPAL">PayPal</option>
        </select>
      </div>
      <div class="col-auto">
        <label class="form-label">Desde</label>
        <input id="rcFrom" type="date" class="form-control">
      </div>
      <div class="col-auto">
        <label class="form-label">Hasta</label>
        <input id="rcTo" type="date" class="form-control">
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" data-accion="conciliar">Conciliar</button>
        <a id="csvExportBtn" href="#" class="btn btn-outline-secondary ms-2 oculto">Exportar CSV</a>
      </div>
    </div>
  </div>
</div>
<div class="oculto" id="rcResults">
  <div class="row">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-warning text-dark">Solo en sistema interno (<span id="internalCount">0</span>)</div>
        <div class="card-body p-0"><div class="table-responsive"><table class="table mb-0 table-sm"><thead><tr><th>External ID</th><th>Monto</th></tr></thead><tbody id="internalTable"></tbody></table></div></div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-info text-dark">Solo en proveedor (<span id="providerCount">0</span>)</div>
        <div class="card-body"><p id="providerNote" class="text-muted small mb-0"></p></div>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
{# PT-139 — Este <script> vivia dentro de `{% block title %}`, y `layouts/admin.html` no declara ese
   bloque: Nunjucks descartaba su contenido EN SILENCIO. El fichero existe desde PT-096 y no se
   cargaba nunca, asi que el boton «Conciliar» llevaba dos meses sin hacer nada.
   `scripts` va despues de `ui-behaviours.js` y `admin.js` en el layout, que es el orden que este
   fichero necesita. #}
<script src="/js/pages/pages-reconciliation.js" defer></script>
{% endblock %}
