{% extends "layouts/base.html" %}
{% block title %}Crear cuenta — IronLoot{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 52" width="44" height="52" class="auth-logo" aria-label="Iron Loot">
        <path d="M3,3 L41,3 L41,31 Q41,49 22,51 Q3,49 3,31 Z" fill="#151515" stroke="#C89B3C" stroke-width="2" stroke-linejoin="round"/>
        <rect x="11" y="13" width="22" height="3.5" rx="1" fill="#C89B3C"/>
        <rect x="19" y="13" width="6" height="20" rx="1" fill="#C89B3C"/>
        <rect x="11" y="29.5" width="22" height="3.5" rx="1" fill="#C89B3C"/>
        <circle cx="22" cy="42" r="5.5" fill="none" stroke="#C89B3C" stroke-width="1.5"/>
        <line x1="22" y1="36.8" x2="22" y2="38.2" stroke="#C89B3C" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="27.2" y1="42" x2="25.8" y2="42" stroke="#C89B3C" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="16.8" y1="42" x2="18.2" y2="42" stroke="#C89B3C" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="22" cy="42" r="1.5" fill="#C89B3C"/>
      </svg>
      <h1 class="auth-title">Crear cuenta</h1>
      <p class="auth-subtitle">Únete a la plataforma Iron Loot</p>
    </div>

    <form id="registerForm" class="auth-form">
      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <input class="form-control" type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input class="form-control" type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input class="form-control" type="password" id="password" name="password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg">Registrarme</button>
      <div id="registerError" class="alert alert-error oculto mensaje-accion"></div>
    </form>

    <div class="auth-footer">
      ¿Ya tienes cuenta? <a href="/auth/login">Inicia sesión</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/js/pages/pages-auth-register.js"></script>

{% endblock %}
