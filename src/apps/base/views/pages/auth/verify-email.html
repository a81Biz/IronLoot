{% extends "layouts/base.html" %}
{% block title %}Verificar correo — IronLoot{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 52" width="44" height="52" class="auth-logo" aria-label="Iron Loot">
        <path d="M3,3 L41,3 L41,31 Q41,49 22,51 Q3,49 3,31 Z" fill="#151515" stroke="#C89B3C" stroke-width="2" stroke-linejoin="round"/>
        <rect x="11" y="13" width="22" height="3.5" rx="1" fill="#C89B3C"/>
        <rect x="19" y="13" width="6" height="20" rx="1" fill="#C89B3C"/>
        <rect x="11" y="29.5" width="22" height="3.5" rx="1" fill="#C89B3C"/>
        <circle cx="22" cy="42" r="5.5" fill="none" stroke="#C89B3C" stroke-width="1.5"/>
        <line x1="22" y1="36.8" x2="22" y2="38.2" stroke="#C89B3C" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="27.2" y1="42" x2="25.8" y2="42" stroke="#C89B3C" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="16.8" y1="42" x2="18.2" y2="42" stroke="#C89B3C" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="22" cy="42" r="1.5" fill="#C89B3C"/>
      </svg>
      <h1 class="auth-title">Verificando correo…</h1>
    </div>

    <div id="verifyStatus" class="auth-message">
      <p>Procesando tu verificación, por favor espera.</p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const token = new URLSearchParams(window.location.search).get('token') || '{{ token }}';
if (token) {
  fetch('/api/v1/auth/verify-email', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token }),
  }).then(res => {
    const el = document.getElementById('verifyStatus');
    if (res.ok) {
      el.innerHTML = '<div class="alert alert-success">¡Correo verificado! <a href="/auth/login">Iniciar sesión</a></div>';
    } else {
      el.innerHTML = '<div class="alert alert-error">Token inválido o expirado. <a href="/auth/recovery">Solicitar nuevo enlace</a></div>';
    }
  }).catch(() => {
    document.getElementById('verifyStatus').innerHTML = '<div class="alert alert-error">Error de conexión.</div>';
  });
}
</script>
{% endblock %}
