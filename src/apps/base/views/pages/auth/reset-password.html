{% extends "layouts/base.html" %}
{% block title %}Nueva contraseña — IronLoot{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 52" width="44" height="52" class="auth-logo" aria-label="Iron Loot">
        <path d="M3,3 L41,3 L41,31 Q41,49 22,51 Q3,49 3,31 Z" fill="#151515" stroke="#C89B3C" stroke-width="2" stroke-linejoin="round"/>
        <rect x="11" y="13" width="22" height="3.5" rx="1" fill="#C89B3C"/>
        <rect x="19" y="13" width="6" height="20" rx="1" fill="#C89B3C"/>
        <rect x="11" y="29.5" width="22" height="3.5" rx="1" fill="#C89B3C"/>
        <circle cx="22" cy="42" r="5.5" fill="none" stroke="#C89B3C" stroke-width="1.5"/>
        <line x1="22" y1="36.8" x2="22" y2="38.2" stroke="#C89B3C" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="27.2" y1="42" x2="25.8" y2="42" stroke="#C89B3C" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="16.8" y1="42" x2="18.2" y2="42" stroke="#C89B3C" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="22" cy="42" r="1.5" fill="#C89B3C"/>
      </svg>
      <h1 class="auth-title">Nueva contraseña</h1>
      <p class="auth-subtitle">Elige una contraseña segura de al menos 8 caracteres</p>
    </div>

    <form id="resetForm" class="auth-form">
      <input type="hidden" id="token" value="{{ token }}">
      <div class="form-group">
        <label for="password">Nueva contraseña</label>
        <input class="form-control" type="password" id="password" name="password" required minlength="8">
      </div>
      <div class="form-group">
        <label for="confirm">Confirmar contraseña</label>
        <input class="form-control" type="password" id="confirm" name="confirm" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg">Cambiar contraseña</button>
      <div id="resetMsg" style="display:none;margin-top:.75rem;"></div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById('resetMsg');
  if (e.target.password.value !== e.target.confirm.value) {
    msgEl.className = 'alert alert-error'; msgEl.textContent = 'Las contraseñas no coinciden.'; msgEl.style.display = 'block'; return;
  }
  try {
    const res = await fetch('/api/v1/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: document.getElementById('token').value, password: e.target.password.value }),
    });
    if (res.ok) { window.location.href = '/auth/login'; }
    else { const d = await res.json(); msgEl.className = 'alert alert-error'; msgEl.textContent = d.message || 'Error al cambiar.'; msgEl.style.display = 'block'; }
  } catch { msgEl.className = 'alert alert-error'; msgEl.textContent = 'Error de conexión.'; msgEl.style.display = 'block'; }
});
</script>
{% endblock %}
