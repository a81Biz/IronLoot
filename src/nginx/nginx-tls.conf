# PT-158 — Terminación TLS para ejercer la suite QA sobre origen seguro.
#
# NO se carga por defecto. Se activa con `docker compose --profile tls up -d nginx`, y requiere
# haber generado y confiado el certificado — ver `tls/README.md`.
#
# Por qué existe: la suite QA corre sobre `http://`, así que las cookies `Secure` y las APIs que el
# navegador reserva a contextos seguros **no quedan ejercidas**. La suite pasa y lo que no probó no
# aparece por ninguna parte.
#
# Se mantiene el 80 abierto **redirigiendo**, no cerrado: cerrarlo rompería los healthchecks de los
# contenedores, que piden `/` por HTTP, y ese es justo el fallo que PT-147 dejó vigilado.

server {
    listen 80;
    server_name ironloot.local base.ironloot.local client.ironloot.local admin.ironloot.local api.ironloot.local;

    # El healthcheck sigue por HTTP: los contenedores lo piden así y no negocian TLS.
    location = / {
        proxy_pass http://base:5174;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name base.ironloot.local;

    ssl_certificate     /etc/nginx/tls/ironloot.local.crt;
    ssl_certificate_key /etc/nginx/tls/ironloot.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://base:5174;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sin esto el SSR construye URLs `http://` detrás de un TLS terminado, que es la forma
        # clásica de romper el retorno de un pago (ADR-045 y su familia).
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name client.ironloot.local;

    ssl_certificate     /etc/nginx/tls/ironloot.local.crt;
    ssl_certificate_key /etc/nginx/tls/ironloot.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://client:5175;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.ironloot.local;

    ssl_certificate     /etc/nginx/tls/ironloot.local.crt;
    ssl_certificate_key /etc/nginx/tls/ironloot.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://admin:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.ironloot.local;

    ssl_certificate     /etc/nginx/tls/ironloot.local.crt;
    ssl_certificate_key /etc/nginx/tls/ironloot.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://api:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
